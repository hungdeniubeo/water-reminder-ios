<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Water Reminder — build a better daily rhythm</title>
  <desc id="desc">Dark ocean-blue promotional illustration with a light iPhone-style hydration dashboard concept on the right.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091B31"/>
      <stop offset="58%" stop-color="#103B54"/>
      <stop offset="100%" stop-color="#08646A"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#80F0DE"/>
      <stop offset="100%" stop-color="#34CBD0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF7F7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#58DCD2" stop-opacity=".36"/>
      <stop offset="100%" stop-color="#58DCD2" stop-opacity="0"/>
    </radialGradient>
    <filter id="phoneShadow" x="-50%" y="-40%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="500" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="500" fill="url(#background)"/>
    <circle cx="995" cy="100" r="325" fill="url(#glow)"/>
    <circle cx="155" cy="550" r="245" fill="#2B91A1" opacity=".09"/>
    <path d="M0 418 C 210 339 352 481 570 416 S 1010 310 1200 404 L1200 500 L0 500Z" fill="#68DACE" opacity=".075"/>
    <path d="M0 447 C 230 372 370 505 626 434 S 1015 350 1200 431" fill="none" stroke="#8BEEE0" stroke-opacity=".18" stroke-width="2"/>
    <g fill="none" stroke="#E2FFFF" stroke-opacity=".08">
      <circle cx="1088" cy="75" r="275"/><circle cx="1088" cy="75" r="215"/>
      <circle cx="1088" cy="75" r="155"/>
    </g>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
      <rect x="83" y="71" width="51" height="51" rx="16" fill="#5CE2D8" fill-opacity=".15" stroke="#9CEDE6" stroke-opacity=".38"/>
      <path d="M109 82 C104 91 97 98 97 106 A12 12 0 0 0 121 106 C121 98 114 90 109 82Z" fill="url(#aqua)"/>
      <path d="M103 108 C103 111 105 113 108 114" fill="none" stroke="#E9FFFB" stroke-width="2" stroke-linecap="round"/>
      <text x="151" y="101" font-size="19" font-weight="700" letter-spacing="3.3" fill="#E7FFFA">WATER REMINDER</text>
      <text x="84" y="218" font-size="61" font-weight="720" letter-spacing="-2.2" fill="#FFFFFF">Build a better</text>
      <text x="84" y="287" font-size="65" font-weight="740" letter-spacing="-2.5" fill="url(#aqua)">daily rhythm.</text>
      <text x="87" y="343" font-size="21" font-weight="400" fill="#D0E5E8">One sip at a time.</text>
      <g>
        <rect x="85" y="390" width="148" height="40" rx="20" fill="#DDFCF7" fill-opacity=".11" stroke="#B5F8EE" stroke-opacity=".25"/>
        <circle cx="107" cy="409.5" r="5" fill="#7BE8D8"/>
        <text x="121" y="416" font-size="13" font-weight="650" letter-spacing=".7" fill="#DCFAF6">iOS CONCEPT</text>
      </g>
    </g>
    <ellipse cx="945" cy="487" rx="191" ry="26" fill="#031324" opacity=".6" filter="url(#phoneShadow)"/>
    <rect x="795" y="23" width="306" height="458" rx="48" fill="#061C29" stroke="#9DFFEE" stroke-opacity=".34" stroke-width="2"/>
    <rect x="805" y="33" width="286" height="438" rx="39" fill="url(#screen)"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
      <text x="829" y="63" font-size="13" font-weight="700" fill="#162C37">9:41</text>
      <g fill="#163746"><rect x="1037" y="54" width="4" height="9" rx="1"/><rect x="1043" y="51" width="4" height="12" rx="1"/><rect x="1049" y="48" width="4" height="15" rx="1"/></g>
      <rect x="902" y="46" width="92" height="23" rx="11.5" fill="#092334"/>
      <text x="831" y="118" font-size="14" font-weight="580" fill="#5D7B81">THURSDAY, NOV 19</text>
      <text x="831" y="150" font-size="26" font-weight="750" letter-spacing="-.7" fill="#173440">Your hydration</text>
      <text x="831" y="173" font-size="14" fill="#718E95">You're making progress today</text>
      <circle cx="948" cy="280" r="80" fill="none" stroke="#DCEEEF" stroke-width="16"/>
      <circle cx="948" cy="280" r="80" fill="none" stroke="url(#aqua)" stroke-width="16" stroke-linecap="round" stroke-dasharray="314 503" transform="rotate(-90 948 280)"/>
      <text x="948" y="274" text-anchor="middle" font-size="38" font-weight="800" letter-spacing="-1.2" fill="#173B46">1,250</text>
      <text x="948" y="302" text-anchor="middle" font-size="15" font-weight="550" fill="#678790">of 2,000 mL</text>
      <text x="948" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#10999E">63% OF DAILY GOAL</text>
      <rect x="831" y="386" width="235" height="54" rx="17" fill="#0FA6AB"/>
      <text x="948" y="421" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">+ Add water</text>
    </g>
    <path d="M745 105 C737 122 724 135 724 150 A21 21 0 1 0 766 150 C766 134 753 122 745 105Z" fill="#80F0DE" fill-opacity=".35"/>
    <path d="M717 219 C713 228 707 236 707 244 A12 12 0 1 0 731 244 C731 236 722 226 717 219Z" fill="#80F0DE" fill-opacity=".23"/>
    <circle cx="742" cy="309" r="5" fill="#B3FFF6" opacity=".48"/>
  </g>
</svg>
