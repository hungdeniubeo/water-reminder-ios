<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Water Reminder — build a better daily rhythm</title>
  <desc id="desc">Dark ocean-blue promotional illustration with a light iPhone-style hydration dashboard concept on the right.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D2239"/>
      <stop offset="58%" stop-color="#874965"/>
      <stop offset="100%" stop-color="#BB6886"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE1E9"/>
      <stop offset="100%" stop-color="#F19AB8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF2F7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#FDA9C9" stop-opacity=".36"/>
      <stop offset="100%" stop-color="#FDA9C9" stop-opacity="0"/>
    </radialGradient>
    <filter id="phoneShadow" x="-50%" y="-40%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="500" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="500" fill="url(#background)"/>
    <circle cx="995" cy="100" r="325" fill="url(#glow)"/>
    <circle cx="155" cy="550" r="245" fill="#F5A9C8" opacity=".09"/>
    <path d="M0 418 C 210 339 352 481 570 416 S 1010 310 1200 404 L1200 500 L0 500Z" fill="#FFBAD2" opacity=".075"/>
    <path d="M0 447 C 230 372 370 505 626 434 S 1015 350 1200 431" fill="none" stroke="#FFE3EE" stroke-opacity=".18" stroke-width="2"/>
    <g fill="none" stroke="#FFEFF3" stroke-opacity=".08">
      <circle cx="1088" cy="75" r="275"/><circle cx="1088" cy="75" r="215"/>
      <circle cx="1088" cy="75" r="155"/>
    </g>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
      <rect x="83" y="71" width="51" height="51" rx="16" fill="#F49FC2" fill-opacity=".15" stroke="#FFDCE9" stroke-opacity=".38"/>
      <path d="M109 82 C104 91 97 98 97 106 A12 12 0 0 0 121 106 C121 98 114 90 109 82Z" fill="url(#aqua)"/>
      <path d="M103 108 C103 111 105 113 108 114" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="151" y="101" font-size="19" font-weight="700" letter-spacing="3.3" fill="#FFF4F8">WATER REMINDER  ♡</text>
      <text x="84" y="218" font-size="61" font-weight="720" letter-spacing="-2.2" fill="#FFFFFF">A little water,</text>
      <text x="84" y="287" font-size="65" font-weight="740" letter-spacing="-2.5" fill="url(#aqua)">a little love.</text>
      <text x="87" y="343" font-size="21" font-weight="400" fill="#FFE9F0">Made with care, just for you.</text>
      <g>
        <rect x="85" y="390" width="148" height="40" rx="20" fill="#FDE9EF" fill-opacity=".11" stroke="#FFE0EB" stroke-opacity=".25"/>
        <circle cx="107" cy="409.5" r="5" fill="#F5ABC8"/>
        <text x="121" y="416" font-size="13" font-weight="650" letter-spacing=".7" fill="#FFF1F6">PWA  ·  VI + EN</text>
      </g>
    </g>
    <ellipse cx="945" cy="487" rx="191" ry="26" fill="#361B2B" opacity=".6" filter="url(#phoneShadow)"/>
    <rect x="795" y="23" width="306" height="458" rx="48" fill="#502B40" stroke="#FFE4EE" stroke-opacity=".34" stroke-width="2"/>
    <rect x="805" y="33" width="286" height="438" rx="39" fill="url(#screen)"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
      <text x="829" y="63" font-size="13" font-weight="700" fill="#65435B">9:41</text>
      <g fill="#8C5A72"><rect x="1037" y="54" width="4" height="9" rx="1"/><rect x="1043" y="51" width="4" height="12" rx="1"/><rect x="1049" y="48" width="4" height="15" rx="1"/></g>
      <rect x="902" y="46" width="92" height="23" rx="11.5" fill="#6D3B52"/>
      <text x="831" y="118" font-size="14" font-weight="580" fill="#AF748E">TODAY</text>
      <text x="831" y="150" font-size="26" font-weight="750" letter-spacing="-.7" fill="#6B4255">Your daily water</text>
      <text x="831" y="173" font-size="14" fill="#A78294">A little care, every day</text>
      <circle cx="948" cy="280" r="80" fill="none" stroke="#F8DCE7" stroke-width="16"/>
      <circle cx="948" cy="280" r="80" fill="none" stroke="url(#aqua)" stroke-width="16" stroke-linecap="round" stroke-dasharray="314 503" transform="rotate(-90 948 280)"/>
      <text x="948" y="274" text-anchor="middle" font-size="38" font-weight="800" letter-spacing="-1.2" fill="#6B3950">1,250</text>
      <text x="948" y="302" text-anchor="middle" font-size="15" font-weight="550" fill="#A68092">of 2,000 mL</text>
      <text x="948" y="329" text-anchor="middle" font-size="12" font-weight="700" fill="#CF618B">63% COMPLETE</text>
      <rect x="831" y="386" width="235" height="54" rx="17" fill="#D45C88"/>
      <text x="948" y="421" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">+ Add water</text>
    </g>
    <path d="M745 105 C737 122 724 135 724 150 A21 21 0 1 0 766 150 C766 134 753 122 745 105Z" fill="#FFE1E9" fill-opacity=".35"/>
    <path d="M717 219 C713 228 707 236 707 244 A12 12 0 1 0 731 244 C731 236 722 226 717 219Z" fill="#FFE1E9" fill-opacity=".23"/>
    <circle cx="742" cy="309" r="5" fill="#FFE6F0" opacity=".48"/>
  </g>
</svg>
