name: PWA checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend and Workers runtime dependencies
        run: npm ci --prefix backend
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test browser and backend logic
        run: npm test
