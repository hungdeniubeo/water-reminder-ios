name: PWA checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check logic.js
          node --check i18n.js
          node --check couple.js
          node --check sw.js
          node --check push-config.js
          node --check backend/worker.js
          node --check backend/lib.js
      - name: Test browser and backend logic
        run: npm test